<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DesignLab logo mark</title>
  <desc id="desc">A D-shaped laboratory mark containing forward and reverse PCR primers and a qPCR probe.</desc>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="#1B1F24"/>

  <!-- D monogram: open workspace for the assay diagram -->
  <path d="M144 120v272h91c101 0 157-49 157-136S336 120 235 120h-91Z"
        fill="none" stroke="#F7F9FC" stroke-width="34" stroke-linejoin="round"/>

  <!-- target template -->
  <path d="M174 228h174M174 284h174" stroke="#9AA7B6" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#9AA7B6" stroke-width="7" stroke-linecap="round" opacity=".82">
    <path d="M196 238v36M222 238v36M248 238v36M274 238v36M300 238v36M326 238v36"/>
  </g>

  <!-- forward primer -->
  <path d="M176 212h90" stroke="#4DD4A0" stroke-width="18" stroke-linecap="round"/>
  <path d="m266 196 30 16-30 16Z" fill="#4DD4A0"/>

  <!-- reverse primer -->
  <path d="M346 300h-90" stroke="#FF8A7A" stroke-width="18" stroke-linecap="round"/>
  <path d="m256 284-30 16 30 16Z" fill="#FF8A7A"/>

  <!-- hydrolysis probe and fluorescence signal -->
  <path d="M238 256h67" stroke="#C39BF0" stroke-width="14" stroke-linecap="round"/>
  <circle cx="238" cy="256" r="13" fill="#C39BF0"/>
  <path d="m319 231 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z" fill="#FFD166"/>
</svg>
